<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Personal invite links</title>
  <meta name="theme-color" content="#4a0a14">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { --maroon: #7a1222; --maroon-deep: #3a0610; --gold: #c9a24a; --gold-light: #f8e6a8; --ivory: #fff9ef; --ink: #3b1d14; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; color: var(--ink);
      font: 19px/1.5 "Cormorant Garamond", Georgia, serif;
      background: radial-gradient(rgba(232, 200, 115, .12) 1.5px, transparent 2px) 0 0 / 26px 26px, linear-gradient(160deg, #4d0914, #2a040c);
      background-attachment: fixed;
      padding: 28px 16px 60px;
    }
    .card { max-width: 460px; margin: 0 auto; background: var(--ivory); border-radius: 26px; padding: 28px 22px; box-shadow: 0 30px 70px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(201, 162, 74, .6); }
    h1 { font: 400 46px/1.1 "Great Vibes", cursive; color: var(--maroon); text-align: center; margin: 0; }
    .sub { text-align: center; font-style: italic; margin: 4px 0 22px; color: #6d4a3c; }
    label { display: grid; gap: 6px; margin-bottom: 16px; }
    label span { font: 600 12px "Cinzel", serif; letter-spacing: .16em; text-transform: uppercase; color: #8a6420; }
    input, textarea { font: inherit; font-size: 18px; color: var(--ink); width: 100%; border: 1.5px solid rgba(201, 162, 74, .6); border-radius: 14px; padding: 12px 14px; background: #fff; }
    textarea { resize: vertical; min-height: 190px; }
    input:focus-visible, textarea:focus-visible { outline: 2px solid var(--maroon); outline-offset: 1px; }
    .link { word-break: break-all; background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(201, 162, 74, .5); margin: 0 0 14px; min-height: 44px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button, a.btn { display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 999px; border: 0; cursor: pointer; text-decoration: none; font: 600 12px "Cinzel", serif; letter-spacing: .12em; text-transform: uppercase; background: var(--maroon); color: var(--gold-light); }
    a.btn.wa { background: linear-gradient(135deg, #1fa855, #128c4a); color: #fff; }
    a.btn.ghost { background: transparent; color: var(--maroon); box-shadow: inset 0 0 0 1.5px var(--gold); grid-column: 1 / -1; }
    h2 { font: 600 13px "Cinzel", serif; letter-spacing: .2em; text-transform: uppercase; color: #8a6420; margin: 28px 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    li button { min-height: 36px; padding: 0 14px; background: #fff; color: var(--maroon); box-shadow: inset 0 0 0 1px rgba(201, 162, 74, .6); text-transform: none; font: 16px "Cormorant Garamond", serif; letter-spacing: 0; }
    .note { font-size: 15px; color: #6d4a3c; margin-top: 22px; }
    .toast { position: fixed; left: 50%; bottom: 30px; translate: -50% 0; background: var(--maroon-deep); color: var(--gold-light); padding: 10px 20px; border-radius: 99px; opacity: 0; transition: .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Personal invites</h1>
    <p class="sub">Type a guest's name — the invitation will greet them by name.</p>

    <label><span>Guest name</span><input id="name" placeholder="e.g. Patel family" autocomplete="off"></label>
    <p class="link" id="link" aria-live="polite"></p>

    <label><span>Message</span><textarea id="msg"></textarea></label>

    <div class="row">
      <a class="btn wa" id="wa" target="_blank" rel="noopener">Send on WhatsApp</a>
      <button type="button" id="copy">Copy message</button>
      <a class="btn ghost" id="preview" target="_blank" rel="noopener">Preview their invite</a>
    </div>

    <h2>Recently made</h2>
    <ul id="recent"></ul>
    <p class="note">This page is only for you — it isn't linked from the invitation.</p>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const base = new URL('./', location.href).href;
    const $ = id => document.getElementById(id);
    const tmpl = name => `🙏 Dear ${name || 'friends'},

With the blessings of our elders, we joyfully invite you to celebrate the wedding of

✨ Vedanshi & Bhavya ✨
Sunday, 28 February 2027

Morning: Ganesh Sthapana · Mandap Muhurat · Haldi
Night: Shubh Lagna 💛

Open your invitation 👇`;
    let edited = false;
    const store = {
      get() { try { return JSON.parse(localStorage.getItem('vb-recent') || '[]'); } catch { return []; } },
      add(n) { try { const r = [n, ...store.get().filter(x => x !== n)].slice(0, 30); localStorage.setItem('vb-recent', JSON.stringify(r)); } catch {} },
    };
    const linkFor = n => n ? `${base}?to=${encodeURIComponent(n)}` : base;
    function update() {
      const n = $('name').value.trim();
      if (!edited) $('msg').value = tmpl(n);
      const link = linkFor(n);
      $('link').textContent = link;
      $('preview').href = link;
      $('wa').href = `https://wa.me/?text=${encodeURIComponent($('msg').value + '\n' + link)}`;
    }
    function renderRecent() {
      $('recent').innerHTML = '';
      store.get().forEach(n => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = n;
        b.onclick = () => { $('name').value = n; edited = false; update(); };
        li.append(b); $('recent').append(li);
      });
    }
    function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); }
    $('name').addEventListener('input', update);
    $('msg').addEventListener('input', () => { edited = true; update(); });
    $('wa').addEventListener('click', () => { const n = $('name').value.trim(); if (n) { store.add(n); renderRecent(); } });
    $('copy').addEventListener('click', async () => {
      const n = $('name').value.trim();
      try { await navigator.clipboard.writeText($('msg').value + '\n' + linkFor(n)); toast('Copied ✨'); if (n) { store.add(n); renderRecent(); } }
      catch { toast('Select the text and copy it'); }
    });
    update(); renderRecent();
  </script>
</body>
</html>
